<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyClaw Test Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f0f0; height: 100dvh; display: flex; flex-direction: column; }
    .header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header label { font-size: 13px; color: #666; }
    .header input { font-size: 13px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 6px; width: 140px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #fff; color: #1a1a1a; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .msg.error { align-self: center; background: #fee; color: #c00; font-size: 13px; }
    .msg.system { align-self: center; background: transparent; color: #999; font-size: 12px; }
    .input-bar { background: #fff; padding: 12px 16px; border-top: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
    .attach-btn { cursor: pointer; font-size: 20px; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .attach-btn:hover { background: #f0f0f0; }
    .attach-btn input { display: none; }
    .attach-indicator { font-size: 12px; color: #007aff; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
    .input-bar input { flex: 1; font-size: 16px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    .input-bar input:focus { border-color: #007aff; }
    .input-bar button { background: #007aff; color: #fff; border: none; border-radius: 20px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { align-self: flex-start; color: #999; font-size: 13px; padding: 4px 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>StudyClaw Test Console</h1>
    <label>Phone:</label>
    <input type="text" id="phone" value="+15550000000">
    <button id="reset" style="font-size:13px;padding:4px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;">Reset</button>
    <button id="memory" style="font-size:13px;padding:4px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;">Memory</button>
  </div>
  <div class="messages" id="messages">
    <div class="msg system">Send a message to start the conversation. This simulates texting the StudyClaw number.</div>
  </div>
  <div class="input-bar">
    <label class="attach-btn" title="Attach image or PDF">
      &#x1F4CE;
      <input type="file" id="fileInput" accept="image/*,.pdf,.docx,.xlsx,.doc,.xls">
    </label>
    <span class="attach-indicator" id="attachIndicator"></span>
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
    <button id="send">Send</button>
  </div>
  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const phoneEl = document.getElementById('phone');
    const sendBtn = document.getElementById('send');
    const fileInput = document.getElementById('fileInput');
    const attachIndicator = document.getElementById('attachIndicator');

    let pendingImage = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        pendingImage = { base64, mimeType: file.type || 'image/jpeg' };
        attachIndicator.textContent = file.name;
      };
      reader.readAsDataURL(file);
    });

    function linkify(text) {
      return String(text).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:inherit;text-decoration:underline">$1</a>');
    }

    function stripMarkdown(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '$1')  // **bold** → bold
        .replace(/\*(.+?)\*/g, '$1')       // *italic* → italic
        .replace(/^#{1,3}\s+/gm, '')       // ### headers → plain
        .replace(/^[•●]\s*/gm, '- ');      // bullets → dashes
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      const str = stripMarkdown(String(text || ''));
      const escaped = str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      div.innerHTML = linkify(escaped).replace(/\n/g,'<br>');
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function send() {
      const message = inputEl.value.trim();
      if (!message && !pendingImage) return;

      const phone = phoneEl.value.trim();
      inputEl.value = '';
      sendBtn.disabled = true;

      const displayMsg = pendingImage ? (message ? `[image] ${message}` : '[image]') : message;
      addMessage(displayMsg, 'user');
      const typing = addMessage('typing...', 'typing');

      const payload = { phone, message };
      if (pendingImage) {
        payload.image = pendingImage;
        pendingImage = null;
        attachIndicator.textContent = '';
        fileInput.value = '';
      }

      try {
        const res = await fetch('/test/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        typing.remove();

        if (data.error) {
          addMessage(data.error, 'error');
        } else {
          const messages = Array.isArray(data.response) ? data.response : [data.response];
          for (let i = 0; i < messages.length; i++) {
            if (i > 0) await new Promise(r => setTimeout(r, 400));
            addMessage(messages[i], 'bot');
          }
        }
      } catch (err) {
        typing.remove();
        addMessage(`Error: ${err.message}`, 'error');
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });

    document.getElementById('reset').addEventListener('click', async () => {
      const phone = phoneEl.value.trim();
      await fetch('/test/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) });
      messagesEl.innerHTML = '<div class="msg system">Student data reset. Send a message to start fresh.</div>';
    });

    document.getElementById('memory').addEventListener('click', async () => {
      const phone = phoneEl.value.trim();
      const res = await fetch('/test/memory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) });
      const data = await res.json();
      addMessage(`📋 Memory:\n${data.memory}`, 'system');
    });

    inputEl.focus();
  </script>
</body>
</html>
